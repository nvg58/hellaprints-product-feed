name: refresh-feed

# Daily full snapshot: re-read the catalog (prices/titles/images), fetch PDP details for
# products not already cached, rebuild the parquet shards and force-push them to gh-pages,
# which is what OpenAI's hosted-URL connector reads.
on:
  schedule:
    - cron: '20 9 * * *' # 09:20 UTC ≈ 04:20 America/Chicago (store's account timezone)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyarrow

      # The PDP cache is what keeps the daily run cheap: only products missing from it are
      # crawled. A cold cache means a full ~2 h crawl, which still fits the job timeout.
      - name: Restore PDP detail cache
        uses: actions/cache@v4
        with:
          path: data/details.jsonl
          key: pdp-details-${{ github.run_id }}
          restore-keys: |
            pdp-details-

      - name: Crawl catalog
        run: node gen-openai-product-feed.mjs catalog

      - name: Fetch details for new products
        run: node gen-openai-product-feed.mjs details --concurrency=20

      - name: Build feed
        run: |
          node gen-openai-product-feed.mjs build --out=hellaprints-openai-products.tsv
          node validate-feed.mjs hellaprints-openai-products.tsv --sample-urls=10

      - name: Build parquet shards
        run: python3 make-parquet.py --in hellaprints-openai-products.tsv --outdir dist

      - name: Publish to gh-pages
        env:
          FEED_REPO: ${{ github.repository }}
          FEED_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: ./publish-feed.sh

      - name: Summary
        run: |
          {
            echo '### Feed refreshed'
            echo
            python3 - <<'PY'
          import json
          m = json.load(open('dist/manifest.json'))
          print(f"- rows: **{m['rows']}**")
          for s in m['shards']:
              print(f"- `{s['file']}` — {s['rows']} rows, {s['bytes']/1e6:.1f} MB")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
