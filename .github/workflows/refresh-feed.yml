name: refresh-feed

# Daily full snapshot: re-read the catalog (prices/titles/images), fetch PDP details for
# products not already cached, rebuild the parquet shards + the Pinterest catalog CSV and
# force-push them to gh-pages, which is what OpenAI's hosted-URL connector and Pinterest's
# catalog ingestion read.
on:
  schedule:
    - cron: '20 9 * * *' # 09:20 UTC ≈ 04:20 America/Chicago (store's account timezone)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyarrow

      # The PDP cache is what keeps the daily run cheap: only products missing from it are
      # crawled. A cold cache means a full ~2 h crawl, which still fits the job timeout.
      - name: Restore PDP detail cache
        uses: actions/cache@v4
        with:
          path: data/details.jsonl
          key: pdp-details-${{ github.run_id }}
          restore-keys: |
            pdp-details-

      # Cache miss (first run, or eviction after 7 idle days) falls back to the seed asset
      # instead of re-crawling all ~96k product pages.
      - name: Seed PDP cache on a cold start
        if: hashFiles('data/details.jsonl') == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download pdp-cache -R "$GITHUB_REPOSITORY" -p 'details-seed.jsonl.gz' -O - \
            | gunzip > data/details.jsonl
          wc -l data/details.jsonl

      - name: Crawl catalog
        run: node gen-openai-product-feed.mjs catalog

      - name: Fetch details for new products
        run: node gen-openai-product-feed.mjs details --concurrency=20

      # The published feed is restricted to one lifecycle cohort (currently 'harvester').
      # The dashboard owns that cohort, so pull the current list from it; include-ids.txt in
      # this repo is the committed fallback used when the secret or the endpoint is missing.
      # Delete include-ids.txt AND unset the secret to publish the whole catalog again.
      - name: Refresh lifecycle allow-list
        env:
          FEED_FETCH_TOKEN: ${{ secrets.FEED_FETCH_TOKEN }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://hella-ads-dashboard.vercel.app' }}
          FEED_STATE: ${{ vars.FEED_STATE || 'harvester' }}
        run: |
          if [ -z "$FEED_FETCH_TOKEN" ]; then
            echo "no FEED_FETCH_TOKEN secret — using the committed include-ids.txt"
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 \
            "$DASHBOARD_URL/api/feed/lifecycle-ids?state=$FEED_STATE&token=$FEED_FETCH_TOKEN" \
            -o include-ids.new
          n=$(grep -vc '^#' include-ids.new || true)
          # An empty cohort would silently publish an empty feed — keep the previous list instead.
          if [ "${n:-0}" -lt 1 ]; then
            echo "endpoint returned no ids — keeping the committed include-ids.txt"
            rm -f include-ids.new
            exit 0
          fi
          mv include-ids.new include-ids.txt
          echo "allow-list: $n ids ($FEED_STATE)"

      - name: Build feed
        run: |
          ARGS=""
          [ -f include-ids.txt ] && ARGS="--include-ids=include-ids.txt"
          node gen-openai-product-feed.mjs build --out=hellaprints-openai-products.tsv $ARGS
          node validate-feed.mjs hellaprints-openai-products.tsv --sample-urls=10

      - name: Build parquet shards
        run: python3 make-parquet.py --in hellaprints-openai-products.tsv --outdir dist --rows-per-shard 200000

      # Same rows, Pinterest's catalog column set — published next to the parquet as
      # dist/pinterest-products.csv for Pinterest's "data source from URL" ingestion.
      - name: Build Pinterest catalog CSV
        run: node make-pinterest-csv.mjs --custom-label-0="$FEED_STATE"
        env:
          FEED_STATE: ${{ vars.FEED_STATE || 'harvester' }}

      - name: Publish to gh-pages
        env:
          FEED_REPO: ${{ github.repository }}
          FEED_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: ./publish-feed.sh

      # Keep the committed fallback in step with what was just published.
      - name: Commit refreshed allow-list
        run: |
          git config user.name feed-bot
          git config user.email feed-bot@users.noreply.github.com
          git add include-ids.txt
          git diff --cached --quiet && { echo "allow-list unchanged"; exit 0; }
          git commit -q -m "Refresh lifecycle allow-list [skip ci]"
          git push -q origin HEAD:${{ github.ref_name }}

      - name: Summary
        run: |
          {
            echo '### Feed refreshed'
            echo
            python3 - <<'PY'
          import json
          m = json.load(open('dist/manifest.json'))
          print(f"- rows: **{m['rows']}**")
          for s in m['shards']:
              print(f"- `{s['file']}` — {s['rows']} rows, {s['bytes']/1e6:.1f} MB")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
